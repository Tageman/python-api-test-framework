# 生产环境配置
base_url: "https://api.example.com"
db:
  host: "prod-db.example.com"
  port: 3306
  user: "${DB_USER}"
  password: "${DB_PASSWORD}"
  database: "${DB_NAME}"

# 测试数据配置
test_data:
  user:
    username: "${TEST_USERNAME}"
    password: "${TEST_PASSWORD}"
  order:
    order_id: "PROD_ORDER_001"

# 文件上传配置
upload:
  max_file_size: 10485760  # 10MB，生产环境限制文件大小
  allowed_extensions: ["jpg", "jpeg", "png", "pdf"]  # 生产环境限制文件类型
  upload_dir: "uploads/prod" 
