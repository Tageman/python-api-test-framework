[pytest]
testpaths = test_cases
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    --html=reports/report.html
    --self-contained-html
    --alluredir=reports/allure-results
    --capture=no
    -v
    --tb=short
    --reruns 3
    --reruns-delay 1
markers =
    smoke: 冒烟测试
    regression: 回归测试
    api: API测试 